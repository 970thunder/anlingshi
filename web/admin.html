<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员后台</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><div class="shell"><header class="topbar"><div class="brand"><span class="brand-mark">A</span><div><strong>/admij 管理后台</strong><span>模型与授权刷新设备</span></div></div><div class="status"><a href="/">返回前台</a><button id="logout" hidden>退出</button></div></header>
<main><section id="loginPanel" class="panel admin-login"><p class="eyebrow">ADMIN ACCESS</p><h1>管理员登录</h1><form id="loginForm"><label>用户名<input id="username" required autocomplete="username"></label><label>密码<input id="password" type="password" required autocomplete="current-password"></label><button type="submit">登录</button><p id="loginError" class="form-error"></p></form></section>
<section id="adminPanel" hidden>
<div class="panel"><div class="panel-head"><div><p class="eyebrow">MODEL REGISTRY</p><h1>模型配置</h1></div><button id="newModel">新增模型</button></div><p class="note">API Key 加密保存在服务器，只显示配置状态。保存需要设置 ADMIN_ENCRYPTION_KEY。</p><div class="table-wrap"><table><thead><tr><th>名称</th><th>URL</th><th>模型</th><th>状态</th><th>Key</th><th>权重</th><th>操作</th></tr></thead><tbody id="modelRows"></tbody></table></div></div>
<section id="editor" class="panel" hidden><div class="panel-head"><h2>编辑模型</h2><button id="cancelEdit">取消</button></div><form id="modelForm" class="model-form"><input id="modelId" type="hidden"><label>内部名称<input id="modelName" required placeholder="deepseek"></label><label>显示名称<input id="displayName" required placeholder="DeepSeek"></label><label>接口 URL<input id="baseUrl" placeholder="https://example.com/v1"></label><label>API Key（留空保留原值）<input id="apiKey" type="password" autocomplete="new-password"></label><label>模型名称<input id="modelNameValue" placeholder="model-id"></label><label>权重<input id="weight" type="number" min="0" max="100" step="0.1" value="1"></label><label>超时秒数<input id="timeout" type="number" min="1" max="120" value="15"></label><label class="check"><input id="enabled" type="checkbox"> 启用</label><div><button type="submit">保存</button><button id="testModel" type="button">测试连接</button></div><p id="formMessage" class="form-error"></p></form></section>
<section class="panel"><div class="panel-head"><div><p class="eyebrow">AUTHORIZED DEVICES</p><h2>授权刷新设备</h2></div><button id="newDevice">创建设备</button></div><p class="note">创建后只显示一次设备 ID 和配对令牌。将其填写到 Windows 授权刷新终端；设备无需管理员密码。</p><div class="table-wrap"><table><thead><tr><th>名称</th><th>设备 ID</th><th>最近上传</th><th>凭证到期</th><th>操作</th></tr></thead><tbody id="deviceRows"></tbody></table></div></section>
</section></main></div><script src="/static/admin.js" defer></script></body></html>
